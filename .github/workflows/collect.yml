# Hourly data collection for the free deployment (docs/DEPLOY_FREE.md).
# Needs the repository secret DATABASE_URL. Without it the run only prints a notice.
name: collect

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write   # upload training-data files to a release

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  # keep the database under a free 0.5 GB plan
  RETENTION_RAW_PAYLOAD_DAYS: "1"
  RETENTION_WATER_LEVEL_DAYS: "8"
  RETENTION_RAIN_GAUGE_DAYS: "2"
  RETENTION_FORECAST_DAYS: "3"
  RETENTION_OBSERVATION_DAYS: "14"
  RETENTION_LOG_DAYS: "7"
  RETENTION_TRAINING_DAYS: "3"
  FEATURES_STATION_SCOPE: "key"
  FEATURES_HORIZONS: "1,3,6"
  HYDRO_LEVELS: "5,7,12"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check database secret
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set - nothing to do (see docs/DEPLOY_FREE.md)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Migrate database
        if: steps.check.outputs.skip != 'true'
        run: python -m app.cli init-db
      - name: Collect due sources, features, retention
        if: steps.check.outputs.skip != 'true'
        run: python -m app.cli run-due
      - name: Export training data (once a day, 20:07 UTC = 03:07 Bangkok)
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" != "20" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          BEFORE="$(date -u -d '1 day ago' +%Y-%m-%dT%H:00)"
          FILE="training-$(date -u +%Y%m%d-%H%M).jsonl.gz"
          python -m app.cli features-export --before "$BEFORE" --out "$FILE"
          if [ "$(zcat "$FILE" | wc -l)" -eq 0 ]; then echo "nothing to export"; exit 0; fi
          gh release view training-data >/dev/null 2>&1 || gh release create training-data \
            --title "Water forecast training data" \
            --notes "Hourly feature snapshots + observed outcome (gzip JSON lines). See docs/DRAINAGE.md section 8."
          gh release upload training-data "$FILE" --clobber
          python -m app.cli features-delete --before "$BEFORE"
