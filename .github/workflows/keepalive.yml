# Optional: keeps a free Render web service from sleeping so the first visitor does not wait.
# Set the repository variable API_URL (e.g. https://thai-flood-api.onrender.com) to enable it.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.API_URL }}/health" -o /dev/null || echo "API not reachable yet"
