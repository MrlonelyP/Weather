services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: flood
      POSTGRES_PASSWORD: flood
      POSTGRES_DB: flood_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood -d flood_intel"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://flood:flood@db:5432/flood_intel
    command: python -m app.cli init-db
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://flood:flood@db:5432/flood_intel
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://flood:flood@db:5432/flood_intel
    command: python -m app.scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
